<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة التحول الرقمي 🤖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #f4f1ea;
    --card-bg: #ffffff;
    --text: #1f2430;
    --text-dim: #5b6270;
    --orange: #f07f1a;
    --orange-deep: #d9670c;
    --navy: #232b3d;
    --border: #e7e1d4;
    --correct: #2e9e5b;
    --wrong: #d9463f;
    --gold:#f5b301;
    --silver:#b7bdc6;
    --bronze:#c97a3d;
    --shadow: 0 10px 30px rgba(35,43,61,0.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12141c; --card-bg:#1c212d; --text:#ecebe6; --text-dim:#a6acb8;
      --orange:#f5943a; --orange-deep:#d9670c; --navy:#2a3247; --border:#2c3242;
      --shadow: 0 10px 30px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12141c; --card-bg:#1c212d; --text:#ecebe6; --text-dim:#a6acb8;
    --orange:#f5943a; --orange-deep:#d9670c; --navy:#2a3247; --border:#2c3242;
    --shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh; background:var(--bg);
    font-family:'Cairo', system-ui, sans-serif; color:var(--text);
    display:flex; align-items:flex-start; justify-content:center;
    padding:20px; position:relative; overflow-x:hidden;
  }
  .blob{ position:fixed; border-radius:50%; filter:blur(40px); opacity:.32; z-index:0; pointer-events:none; animation: float 14s ease-in-out infinite; }
  .blob1{ width:260px; height:260px; background:var(--orange); top:-80px; right:-60px; }
  .blob2{ width:220px; height:220px; background:var(--navy); bottom:-70px; left:-60px; animation-delay:3s; }
  .blob3{ width:160px; height:160px; background:var(--orange-deep); top:40%; left:-80px; animation-delay:6s; opacity:.18;}
  @keyframes float{ 0%,100%{transform:translateY(0) translateX(0);} 50%{transform:translateY(-25px) translateX(15px);} }
  #confettiCanvas{ position:fixed; inset:0; pointer-events:none; z-index:50; }

  .app{ width:100%; max-width:680px; position:relative; z-index:1; margin-top:6px;}

  .brand{ text-align:center; margin-bottom:16px; }
  .brand .logo-row{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:4px;}
  .brand .robot{ font-size:38px; display:inline-block; animation:wiggle 2.4s ease-in-out infinite; }
  @keyframes wiggle{ 0%,100%{transform:rotate(0);} 25%{transform:rotate(-8deg);} 75%{transform:rotate(8deg);} }
  .brand h1{ font-size:24px; font-weight:900; margin:0; letter-spacing:.3px;}
  .brand h1 span{ color:var(--orange); }
  .brand p{ margin:4px 0 0; color:var(--text-dim); font-size:13.5px; font-weight:700; }

  .card{
    background:var(--card-bg); border:1px solid var(--border); border-radius:22px;
    box-shadow:var(--shadow); padding:26px; position:relative; overflow:hidden;
  }
  .card::before{ content:""; position:absolute; top:0; right:0; left:0; height:6px; background:linear-gradient(90deg,var(--orange),var(--orange-deep)); }
  .card.shake{ animation: shake .4s ease; }
  @keyframes shake{ 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);} 30%,50%,70%{transform:translateX(-8px);} 40%,60%{transform:translateX(8px);} }
  .card.pulse{ animation: pulse .35s ease; }
  @keyframes pulse{ 0%{transform:scale(1);} 50%{transform:scale(1.012);} 100%{transform:scale(1);} }

  .hidden{ display:none !important; }

  /* ---------- FORM ELEMENTS ---------- */
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:13px; font-weight:800; margin-bottom:6px; color:var(--text-dim); }
  .field input[type="text"], .field input[type="tel"]{
    width:100%; padding:12px 14px; border-radius:12px; border:2px solid var(--border);
    background:var(--bg); color:var(--text); font-family:inherit; font-size:15px; font-weight:700;
  }
  .field input:focus{ outline:none; border-color:var(--orange); }
  .optional-tag{ font-weight:600; color:var(--text-dim); font-size:11.5px; }

  .avatar-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:6px; }
  .avatar-opt{
    aspect-ratio:1; border-radius:14px; border:2px solid var(--border); background:var(--bg);
    display:flex; align-items:center; justify-content:center; font-size:26px; cursor:pointer; transition:all .15s ease;
  }
  .avatar-opt:hover{ transform:translateY(-2px); }
  .avatar-opt.selected{ border-color:var(--orange); background:rgba(240,127,26,0.14); box-shadow:0 0 0 3px rgba(240,127,26,0.2); }

  .mode-toggle{ display:flex; gap:10px; margin-bottom:14px; }
  .mode-btn{
    flex:1; padding:12px; border-radius:12px; border:2px solid var(--border); background:var(--bg);
    font-family:inherit; font-weight:800; font-size:14px; cursor:pointer; color:var(--text); transition:all .15s ease;
  }
  .mode-btn.active{ border-color:var(--orange); background:rgba(240,127,26,0.14); color:var(--orange-deep); }

  .primary-btn{
    width:100%; padding:15px; border:none; border-radius:14px;
    background:linear-gradient(90deg,var(--orange),var(--orange-deep)); color:#fff;
    font-family:inherit; font-size:16.5px; font-weight:900; cursor:pointer; transition:opacity .15s ease;
  }
  .primary-btn:hover{ opacity:.92; }
  .primary-btn:disabled{ opacity:.5; cursor:not-allowed; }

  .ghost-btn{
    width:100%; padding:13px; border-radius:14px; border:2px solid var(--border); background:transparent;
    color:var(--text); font-family:inherit; font-size:14.5px; font-weight:800; cursor:pointer; margin-top:10px;
  }
  .ghost-btn:hover{ border-color:var(--orange); }

  /* ---------- QUIZ SCREEN ---------- */
  .player-strip{
    display:flex; align-items:center; gap:10px; margin-bottom:14px; padding:8px 12px;
    background:var(--bg); border:1px solid var(--border); border-radius:14px; font-size:13px; font-weight:800;
  }
  .player-strip .av{ font-size:20px; }
  .player-strip .nm{ flex:1; }

  .progressbar{ height:8px; width:100%; background:var(--border); border-radius:999px; overflow:hidden; margin-bottom:14px; }
  .progressbar-fill{ height:100%; background:linear-gradient(90deg,var(--orange),var(--orange-deep)); border-radius:999px; transition:width .4s ease; width:0%; }

  .meta-row{ display:flex; justify-content:space-between; align-items:center; font-size:12.5px; font-weight:700; color:var(--text-dim); margin-bottom:12px; flex-wrap:wrap; gap:6px;}
  .badge{ background:var(--navy); color:#fff; padding:4px 12px; border-radius:999px; font-size:12px; font-weight:800; white-space:nowrap;}
  .score-badge{ background:var(--orange); color:#fff; padding:4px 12px; border-radius:999px; font-size:12px; font-weight:800; white-space:nowrap;}
  .streak-badge{ background:linear-gradient(90deg,#ff6a00,#ffb703); color:#fff; padding:4px 12px; border-radius:999px; font-size:12px; font-weight:800; white-space:nowrap; display:none; align-items:center; gap:4px;}
  .streak-badge.show{ display:inline-flex; animation:pop .3s ease;}
  @keyframes pop{ 0%{transform:scale(.6); opacity:0;} 60%{transform:scale(1.15);} 100%{transform:scale(1); opacity:1;} }

  .timer-wrap{ height:6px; width:100%; background:var(--border); border-radius:999px; overflow:hidden; margin-bottom:16px; }
  .timer-fill{ height:100%; width:100%; background:linear-gradient(90deg,#2e9e5b,#f5b301); border-radius:999px; transition:width 1s linear, background-color .3s ease; }
  .timer-fill.danger{ background:linear-gradient(90deg,#d9463f,#f5943a); }

  .qicon{ font-size:30px; margin-bottom:6px; display:inline-block; }
  .question{ font-size:18.5px; font-weight:800; line-height:1.65; margin:2px 0 20px; }

  .options{ display:flex; flex-direction:column; gap:11px; }
  .option{
    text-align:right; background:var(--bg); border:2px solid var(--border); color:var(--text);
    padding:13px 15px; border-radius:14px; font-family:inherit; font-size:15px; font-weight:700;
    cursor:pointer; transition:all .15s ease; display:flex; align-items:center; gap:10px;
  }
  .option:hover:not(:disabled){ border-color:var(--orange); transform:translateY(-1px) scale(1.01); }
  .option:disabled{ cursor:default; }
  .option .letter{ flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--border); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900; color:var(--text-dim);}
  .option.correct{ background:rgba(46,158,91,0.14); border-color:var(--correct); color:var(--correct); animation:pop .3s ease;}
  .option.correct .letter{ background:var(--correct); color:#fff; }
  .option.wrong{ background:rgba(217,70,63,0.12); border-color:var(--wrong); color:var(--wrong); }
  .option.wrong .letter{ background:var(--wrong); color:#fff; }

  .feedback{ margin-top:16px; padding:14px 16px; border-radius:14px; font-size:14px; font-weight:600; line-height:1.7; display:none; }
  .feedback.show{ display:block; animation:fadein .25s ease; }
  .feedback.ok{ background:rgba(46,158,91,0.12); color:var(--correct); border:1px solid rgba(46,158,91,.3); }
  .feedback.bad{ background:rgba(217,70,63,0.10); color:var(--wrong); border:1px solid rgba(217,70,63,.3); }
  @keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .next-btn{ margin-top:20px; width:100%; padding:14px; border:none; border-radius:14px; background:var(--navy); color:#fff; font-family:inherit; font-size:16px; font-weight:800; cursor:pointer; display:none; }
  .next-btn.show{ display:block; animation:fadein .2s ease; }
  .next-btn:hover{ opacity:.9; }

  /* ---------- RESULT / LEADERBOARD ---------- */
  .result-hero{ text-align:center; margin-bottom:14px; }
  .result-hero .emoji{ font-size:56px; animation:pop .4s ease; }
  .result-hero h2{ font-size:22px; font-weight:900; margin:6px 0 2px; }
  .result-hero p.sub{ color:var(--text-dim); font-weight:600; font-size:13.5px; margin:0 0 10px; }
  .result-hero .score-num{ font-size:40px; font-weight:900; color:var(--orange); }

  .stat-row{ display:flex; gap:8px; justify-content:center; margin-bottom:18px; flex-wrap:wrap; }
  .stat-pill{ background:var(--bg); border:1px solid var(--border); border-radius:14px; padding:9px 14px; font-size:12px; font-weight:800; min-width:80px; text-align:center;}
  .stat-pill .n{ display:block; font-size:18px; margin-bottom:2px; }

  .tabs{ display:flex; gap:8px; margin-bottom:14px; }
  .tab-btn{ flex:1; padding:10px; border-radius:12px; border:2px solid var(--border); background:var(--bg); font-family:inherit; font-weight:800; font-size:13.5px; cursor:pointer; color:var(--text-dim); }
  .tab-btn.active{ border-color:var(--orange); color:var(--orange-deep); background:rgba(240,127,26,0.1); }

  .podium{ display:flex; align-items:flex-end; justify-content:center; gap:10px; margin-bottom:18px; }
  .podium-slot{ text-align:center; width:88px; }
  .podium-slot .pav{ font-size:26px; }
  .podium-slot .pname{ font-size:12px; font-weight:800; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .podium-slot .pscore{ font-size:11px; color:var(--text-dim); font-weight:700; }
  .podium-slot .bar{ border-radius:10px 10px 0 0; margin-top:6px; display:flex; align-items:flex-start; justify-content:center; padding-top:6px; font-weight:900; color:#fff; }
  .bar.gold{ height:74px; background:linear-gradient(180deg,var(--gold),#d99000); }
  .bar.silver{ height:56px; background:linear-gradient(180deg,var(--silver),#8b929c); }
  .bar.bronze{ height:44px; background:linear-gradient(180deg,var(--bronze),#a15c28); }

  .lb-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:18px; max-height:320px; overflow-y:auto; }
  .lb-row{ display:flex; align-items:center; gap:10px; background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:9px 12px; font-size:13.5px; font-weight:700; }
  .lb-row.me{ border-color:var(--orange); background:rgba(240,127,26,0.08); }
  .lb-rank{ width:22px; text-align:center; font-weight:900; color:var(--text-dim); flex-shrink:0; }
  .lb-av{ font-size:18px; flex-shrink:0; }
  .lb-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-team{ font-size:11px; color:var(--text-dim); font-weight:700; }
  .lb-score{ color:var(--orange-deep); font-weight:900; flex-shrink:0; }
  .lb-empty{ text-align:center; color:var(--text-dim); font-size:13.5px; font-weight:700; padding:20px 0; }

  .sound-toggle{ position:absolute; top:14px; left:14px; background:var(--bg); border:1px solid var(--border); border-radius:50%; width:34px; height:34px; display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; z-index:2; }
  .sync-badge{ position:absolute; top:14px; right:14px; font-size:10.5px; font-weight:800; padding:4px 9px; border-radius:999px; z-index:2; }
  .sync-badge.on{ background:rgba(46,158,91,0.15); color:var(--correct); }
  .sync-badge.off{ background:rgba(217,70,63,0.1); color:var(--wrong); }

  .footer-note{ text-align:center; margin-top:14px; font-size:11px; color:var(--text-dim); font-weight:600; }
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<canvas id="confettiCanvas"></canvas>

<div class="app">
  <div class="brand">
    <div class="logo-row">
      <span class="robot">🤖</span>
      <h1>منصة <span>التحول الرقمي</span></h1>
    </div>
    <p>امتحان شامل على الدرس الأول والتاني</p>
  </div>

  <div class="card" id="mainCard">
    <button class="sound-toggle" id="soundToggle" title="الصوت">🔊</button>
    <span class="sync-badge" id="syncBadge"></span>

    <!-- ============ LOGIN SCREEN ============ -->
    <div id="loginScreen">
      <div class="field">
        <label>الكود *</label>
        <input type="text" id="nameInput" placeholder="اكتب الكود الخاص بيك" maxlength="4" inputmode="numeric" pattern="[0-9]*">
      </div>
      <div class="field">
        <label>رقم الموبايل <span class="optional-tag">(اختياري)</span></label>
        <input type="tel" id="phoneInput" placeholder="01xxxxxxxxx" maxlength="15">
      </div>
      <div class="field">
        <label>اختر أفاتار</label>
        <div class="avatar-grid" id="avatarGrid"></div>
      </div>

      <button class="primary-btn" id="startBtn">🚀 ابدأ الامتحان</button>
      <button class="ghost-btn" id="viewLbBtn">🏆 عرض لوحة الصدارة بدون لعب</button>
    </div>

    <!-- ============ QUIZ SCREEN ============ -->
    <div id="quizScreen" class="hidden">
      <div class="player-strip">
        <span class="av" id="stripAvatar">🙂</span>
        <span class="nm" id="stripName">—</span>
      </div>
      <div class="progressbar"><div class="progressbar-fill" id="progressFill"></div></div>
      <div class="meta-row">
        <span class="badge" id="qCounter">سؤال 1 / 20</span>
        <span class="streak-badge" id="streakBadge">🔥 <span id="streakNum">0</span></span>
        <span class="score-badge" id="scoreCounter">النقاط: 0</span>
      </div>
      <div class="timer-wrap"><div class="timer-fill" id="timerFill"></div></div>

      <div class="qicon" id="qIcon">💡</div>
      <div class="question" id="questionText"></div>
      <div class="options" id="optionsBox"></div>

      <div class="feedback" id="feedbackBox"></div>
      <button class="next-btn" id="nextBtn">التالي ⟵</button>
    </div>

    <!-- ============ RESULT SCREEN ============ -->
    <div id="resultScreen" class="hidden">
      <div class="result-hero">
        <div class="emoji" id="resultEmoji">🏆</div>
        <h2 id="resultTitle">مبروك!</h2>
        <div class="score-num"><span id="finalCorrect">0</span>/<span id="totalQ">20</span></div>
        <p class="sub" id="resultSub"></p>
      </div>

      <div class="stat-row">
        <div class="stat-pill"><span class="n" id="statPoints">0</span>النقاط</div>
        <div class="stat-pill"><span class="n" id="statStreak">0</span>أطول سلسلة</div>
        <div class="stat-pill"><span class="n" id="statRank">-</span>ترتيبك</div>
      </div>

      <button class="primary-btn" id="playAgainBtn">🔁 العب تاني</button>
      <button class="ghost-btn" id="goLbBtn">🏆 لوحة الصدارة</button>
    </div>

    <!-- ============ LEADERBOARD SCREEN ============ -->
    <div id="lbScreen" class="hidden">
      <div id="podiumBox" class="podium"></div>
      <div id="lbList" class="lb-list"></div>

      <button class="ghost-btn" id="exportExcelBtn">⬇️ تحميل النتائج (Excel)</button>
      <button class="ghost-btn" id="exportPdfBtn">🖨️ تحميل النتائج (PDF)</button>
      <button class="ghost-btn" id="backHomeBtn">⟵ رجوع للرئيسية</button>
    </div>

  </div>

  <div class="footer-note" id="footerNote">اضغط الإجابة الصح قبل ما الوقت يخلص ⏱️</div>
</div>

<script>
/* ================= SOUND ENGINE ================= */
let audioCtx = null;
let soundOn = true;
function ensureCtx(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; } } return audioCtx; }
function beep(f1,f2,dur,type,vol){
  if(!soundOn) return;
  const ctx = ensureCtx(); if(!ctx) return;
  const osc = ctx.createOscillator(); const gain = ctx.createGain();
  osc.type = type||'sine';
  osc.frequency.setValueAtTime(f1, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(Math.max(f2,1), ctx.currentTime+dur);
  gain.gain.setValueAtTime(vol||0.15, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime+dur);
}
function sfxClick(){ beep(500,480,0.06,'square',0.06); }
function sfxCorrect(){ beep(523,784,0.12,'triangle',0.14); setTimeout(()=>beep(784,1046,0.14,'triangle',0.12),90); }
function sfxWrong(){ beep(300,120,0.32,'sawtooth',0.12); }
function sfxTick(){ beep(700,700,0.03,'square',0.03); }
function sfxWin(){ beep(523,523,0.1,'triangle',0.13); setTimeout(()=>beep(659,659,0.1,'triangle',0.13),110); setTimeout(()=>beep(784,784,0.1,'triangle',0.13),220); setTimeout(()=>beep(1046,1046,0.22,'triangle',0.15),330); }

document.getElementById('soundToggle').addEventListener('click', function(){
  soundOn = !soundOn; this.textContent = soundOn ? '🔊':'🔇'; if(soundOn) sfxClick();
});

/* ================= CONFETTI ================= */
const canvas = document.getElementById('confettiCanvas');
const ctx2d = canvas.getContext('2d');
function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas(); window.addEventListener('resize', resizeCanvas);
let particles = [];
const confettiColors = ['#f07f1a','#d9670c','#2e9e5b','#232b3d','#f5b301','#d9463f'];
function burstConfetti(count, originY){
  for(let i=0;i<count;i++){
    particles.push({ x:Math.random()*canvas.width, y: originY!==undefined?originY:-20,
      vx:(Math.random()-0.5)*6, vy:Math.random()*3+2, size:Math.random()*7+4,
      color:confettiColors[Math.floor(Math.random()*confettiColors.length)],
      rot:Math.random()*360, vrot:(Math.random()-0.5)*10, life:0 });
  }
}
function smallBurst(x,y){
  for(let i=0;i<18;i++){
    const angle = Math.random()*Math.PI*2; const speed = Math.random()*4+2;
    particles.push({ x,y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed-2, size:Math.random()*5+3,
      color:confettiColors[Math.floor(Math.random()*confettiColors.length)],
      rot:Math.random()*360, vrot:(Math.random()-0.5)*14, life:0, gravity:0.15, maxLife:50 });
  }
}
function animateParticles(){
  ctx2d.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.vy += (p.gravity!==undefined?p.gravity:0.05);
    p.x += p.vx; p.y += p.vy; p.rot += p.vrot; p.life++;
    ctx2d.save(); ctx2d.translate(p.x,p.y); ctx2d.rotate(p.rot*Math.PI/180);
    ctx2d.fillStyle = p.color; ctx2d.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6); ctx2d.restore();
  });
  particles = particles.filter(p => p.maxLife ? p.life < p.maxLife : p.y < canvas.height+30);
  requestAnimationFrame(animateParticles);
}
animateParticles();

/* ================= QUESTION DATA ================= */
const questions = [

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ================= STORE (real backend via /api on Railway) ================= */
const AVATARS = ["🦁","🐱","🐼","🦊","🐧","🐸","🦄","🐵","🐯","🐨"];
const LOCAL_KEY = "td_leaderboard_local_v1";
const API_BASE = "/api";
const Store = {
  ready: false,
  online: false,
  async init(){
    try{
      const res = await fetch(API_BASE + '/ping', { cache:'no-store' });
      this.online = res.ok;
    }catch(e){ this.online = false; }
    this.ready = true;
    updateSyncBadge();
  },
  getLocalList(){
    try{ return JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); }catch(e){ return []; }
  },
  setLocalList(list){
    try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(list)); }catch(e){}
  },
  async saveResult(playerId, data){
    if(this.online){
      try{
        const res = await fetch(`${API_BASE}/players/${encodeURIComponent(playerId)}`, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(data)
        });
        if(res.ok) return;
        this.online = false; updateSyncBadge();
      }catch(e){ this.online = false; updateSyncBadge(); }
    }
    // local fallback (only visible on this device)
    const list = this.getLocalList();
    const idx = list.findIndex(p => p.id === playerId);
    const record = Object.assign({id:playerId}, data);
    if(idx >= 0) list[idx] = record; else list.push(record);
    this.setLocalList(list);
  },
  async hasResult(playerId){
    if(this.online){
      try{
        const res = await fetch(`${API_BASE}/players/${encodeURIComponent(playerId)}`, { cache:'no-store' });
        if(res.ok){ const j = await res.json(); return !!j.exists; }
        this.online = false; updateSyncBadge();
      }catch(e){ this.online = false; updateSyncBadge(); }
    }
    const list = this.getLocalList();
    return list.some(p => p.id === playerId);
  },
  subscribeLeaderboard(cb){
    let stopped = false;
    const poll = async () => {
      if(stopped) return;
      if(this.online){
        try{
          const res = await fetch(`${API_BASE}/players`, { cache:'no-store' });
          if(res.ok){
            const list = await res.json();
            cb(list);
          } else { this.online = false; updateSyncBadge(); cb(this.getLocalList()); }
        }catch(e){ this.online = false; updateSyncBadge(); cb(this.getLocalList()); }
      } else {
        cb(this.getLocalList());
      }
      if(!stopped) setTimeout(poll, 4000); // refresh every 4s while leaderboard is open
    };
    poll();
    return () => { stopped = true; };
  }
};

function updateSyncBadge(){
  const el = document.getElementById('syncBadge');
  if(!Store.ready){ el.textContent=''; return; }
  if(Store.online){
    el.textContent = '🟢 متصل بالسيرفر';
    el.className = 'sync-badge on';
  } else {
    el.textContent = '🟠 نتيجة محلية بس (السيرفر مش متصل)';
    el.className = 'sync-badge off';
  }
}

  if(!/^\d{4}$/.test(code)){ alert('الكود لازم يكون 4 أرقام بالظبط 🙂'); return; }

  startBtnEl.disabled = true;
  const originalLabel = startBtnEl.textContent;
  startBtnEl.textContent = 'بيتم التحقق من الكود...';

  let used = false;
  try{ used = await Store.hasResult(code); }catch(e){ used = false; }

  startBtnEl.disabled = false;
  startBtnEl.textContent = originalLabel;

  if(used){
    sfxWrong();
    alert('❌ الكود ده اتستخدم قبل كده لدخول الامتحان، مينفعش تعيد الدخول بنفس الكود.');
    return;
  }

  player.id = code;
  player.name = code;
  player.phone = document.getElementById('phoneInput').value.trim();
  sfxClick();
  alert('تنبيه ⏱️: الامتحان هيبدأ دلوقتي، كل سؤال ليه 20 ثانية بس، فجاوب بسرعة وركّز!');
  startGame();
});

/* ---- Quiz mechanics ---- */
const questionText = document.getElementById('questionText');
const qIcon = document.getElementById('qIcon');
const optionsBox = document.getElementById('optionsBox');
const feedbackBox = document.getElementById('feedbackBox');
const nextBtn = document.getElementById('nextBtn');
const progressFill = document.getElementById('progressFill');
const qCounter = document.getElementById('qCounter');
const scoreCounter = document.getElementById('scoreCounter');
const streakBadge = document.getElementById('streakBadge');
const streakNum = document.getElementById('streakNum');
const timerFill = document.getElementById('timerFill');
const mainCard = document.getElementById('mainCard');
const letters = ['أ','ب','ج','د'];
let timerInterval = null, timeLeft = 20;
const TIME_LIMIT = 20;

function buildGame(){
  gameQuestions = shuffleArray(questions).map(item => {
    const shuffledOptions = shuffleArray(item.options);
    return { icon:item.icon, q:item.q, options:shuffledOptions, correctIndex:shuffledOptions.indexOf(item.correctText), explain:item.explain };
  });
}

function startGame(){
  current=0; score=0; correctCount=0; streak=0; bestStreak=0; answered=false; history=[]; totalTimeMs=0;
  document.getElementById('stripAvatar').textContent = player.avatar;
  document.getElementById('stripName').textContent = player.name;
  buildGame();
  showScreen('quiz');
  renderQuestion();
}

function updateStreakBadge(){
  if(streak >= 2){ streakBadge.classList.add('show'); streakNum.textContent = streak; }
  else streakBadge.classList.remove('show');
}

function renderQuestion(){
  answered = false;
  const item = gameQuestions[current];
  qIcon.textContent = item.icon;
  questionText.textContent = item.q;
  optionsBox.innerHTML = '';
  feedbackBox.className = 'feedback'; feedbackBox.textContent = '';
  nextBtn.className = 'next-btn';

  item.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="letter">${letters[idx]}</span><span>${opt}</span>`;
    btn.addEventListener('click', () => selectOption(idx, btn));
    optionsBox.appendChild(btn);
  });

  qCounter.textContent = `سؤال ${current+1} / ${gameQuestions.length}`;
  scoreCounter.textContent = `النقاط: ${score}`;
  progressFill.style.width = `${(current/gameQuestions.length)*100}%`;
  startTimer();
}

let qStartTs = 0;

function startTimer(){
  timeLeft = TIME_LIMIT; qStartTs = performance.now();
  timerFill.style.transition = 'none'; timerFill.style.width = '100%'; timerFill.classList.remove('danger');
  void timerFill.offsetWidth;
  timerFill.style.transition = 'width 1s linear, background-color .3s ease';
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft -= 1;
    const pct = Math.max(0,(timeLeft/TIME_LIMIT)*100);
    timerFill.style.width = pct + '%';
    if(timeLeft <= 5){ timerFill.classList.add('danger'); sfxTick(); }
    if(timeLeft <= 0){ clearInterval(timerInterval); if(!answered) forceTimeout(); }
  }, 1000);
}

function forceTimeout(){
  answered = true;
  totalTimeMs += TIME_LIMIT*1000;
  const item = gameQuestions[current];
  const allBtns = optionsBox.querySelectorAll('.option');
  allBtns.forEach(b => b.disabled = true);
  allBtns[item.correctIndex].classList.add('correct');
  history.push(false); streak = 0; updateStreakBadge();
  sfxWrong();
  mainCard.classList.add('shake'); setTimeout(()=>mainCard.classList.remove('shake'),400);
  feedbackBox.classList.add('show','bad');
  feedbackBox.textContent = '⏰ خلص الوقت! ' + item.explain;
  nextBtn.classList.add('show');
  nextBtn.textContent = (current === gameQuestions.length-1) ? 'شوف النتيجة 🏁' : 'التالي ⟵';
}

function selectOption(idx, btnEl){
  if(answered) return;
  answered = true;
  clearInterval(timerInterval);
  totalTimeMs += Math.min(TIME_LIMIT*1000, performance.now()-qStartTs);
  sfxClick();

  const item = gameQuestions[current];
  const allBtns = optionsBox.querySelectorAll('.option');
  allBtns.forEach(b => b.disabled = true);

  const isCorrect = idx === item.correctIndex;

  if(isCorrect){
    btnEl.classList.add('correct');
    const points = 10;
    score += points; correctCount++; streak++; bestStreak = Math.max(bestStreak, streak);
    sfxCorrect();
    mainCard.classList.add('pulse'); setTimeout(()=>mainCard.classList.remove('pulse'),350);
    const rect = btnEl.getBoundingClientRect();
    smallBurst(rect.left+rect.width/2, rect.top+rect.height/2);
    feedbackBox.classList.add('show','ok');
    feedbackBox.textContent = `✅ إجابة صحيحة! (+${points} نقطة) ` + item.explain;
  } else {
    btnEl.classList.add('wrong');
    allBtns[item.correctIndex].classList.add('correct');
    streak = 0; sfxWrong();
    mainCard.classList.add('shake'); setTimeout(()=>mainCard.classList.remove('shake'),400);
    feedbackBox.classList.add('show','bad');
    feedbackBox.textContent = '❌ إجابة غلط. ' + item.explain;
  }
  updateStreakBadge();
  history.push(isCorrect);
  scoreCounter.textContent = `النقاط: ${score}`;
  nextBtn.classList.add('show');
  nextBtn.textContent = (current === gameQuestions.length-1) ? 'شوف النتيجة 🏁' : 'التالي ⟵';
}

nextBtn.addEventListener('click', () => {
  sfxClick();
  current++;
  if(current >= gameQuestions.length) finishGame();
  else renderQuestion();
});

async function finishGame(){
  clearInterval(timerInterval);
  const record = {
    name: player.name,
    phone: player.phone || '',
    avatar: player.avatar,
    score: score,
    correctCount: correctCount,
    totalQuestions: gameQuestions.length,
    bestStreak: bestStreak,
    totalTimeMs: Math.round(totalTimeMs),
    updatedAt: Date.now()
  };
  await Store.saveResult(player.id, record);

  document.getElementById('finalCorrect').textContent = correctCount;
  document.getElementById('totalQ').textContent = gameQuestions.length;
  document.getElementById('statPoints').textContent = score;
  document.getElementById('statStreak').textContent = bestStreak;

  const pct = correctCount/gameQuestions.length;
  let emoji, title, sub;
  if(pct >= 0.9){ emoji='🏆'; title='ممتاز! فاهم الدرس زي المعلم!'; sub='جاوبت صح في معظم الأسئلة — أنت فاهم أساسيات الكمبيوتر تمام.'; sfxWin(); burstConfetti(140,-20); }
  else if(pct >= 0.7){ emoji='🎉'; title='أداء كويس جدًا!'; sub='فاهم غالبية النقط، راجع الأسئلة اللي غلطت فيها وهتبقى جاهز تمامًا.'; sfxWin(); burstConfetti(70,-20); }
  else if(pct >= 0.4){ emoji='💪'; title='بداية طيبة، محتاج مراجعة بسيطة'; sub='راجع تاني فكرة الـ 0 و1، والـ CPU/RAM/Storage، وحاول تاني.'; }
  else { emoji='📘'; title='محتاج تراجع الدرس تاني'; sub='ابدأ من فكرة "الكمبيوتر بيفهم بس 0 و1" وكمّل خطوة بخطوة.'; }
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultSub').textContent = sub;

  // compute rank
  const list = await getFullLeaderboard();
  const individuals = list.filter(p => p.score !== undefined).sort((a,b)=> b.score - a.score || a.totalTimeMs - b.totalTimeMs);
  const myRank = individuals.findIndex(p => p.id === player.id) + 1;
  document.getElementById('statRank').textContent = myRank > 0 ? ('#'+myRank) : '-';

  showScreen('result');
}

/* ---- Leaderboard ---- */
let lbUnsub = null;
let lastLbData = [];
function getFullLeaderboard(){
  return new Promise(resolve => {
    if(Store.db){
      Store.db.collection('players').orderBy('score','desc').limit(100).get()
        .then(snap => resolve(snap.docs.map(d => Object.assign({id:d.id}, d.data()))))
        .catch(() => resolve(Store.getLocalList()));
    } else {
      resolve(Store.getLocalList());
    }
  });
}

function openLeaderboard(){
  showScreen('lb');
  if(lbUnsub) lbUnsub();
  lbUnsub = Store.subscribeLeaderboard(data => { lastLbData = data; renderLeaderboard(data); });
}

function renderLeaderboard(data){
  const podiumBox = document.getElementById('podiumBox');
  const lbList = document.getElementById('lbList');
  podiumBox.innerHTML = ''; lbList.innerHTML = '';

  const rows = data.filter(p => p.name).slice().sort((a,b)=> (b.score||0)-(a.score||0) || (a.totalTimeMs||0)-(b.totalTimeMs||0));

  if(rows.length === 0){
    lbList.innerHTML = '<div class="lb-empty">مفيش نتايج لسه... كن أول واحد يلعب! 🎮</div>';
    return;
  }

  // podium (top 3)
  const podiumOrder = [1,0,2]; // silver, gold, bronze visual order
  const barClasses = {0:'gold',1:'silver',2:'bronze'};
  podiumOrder.forEach(rankIdx => {
    const p = rows[rankIdx];
    const slot = document.createElement('div');
    slot.className = 'podium-slot';
    if(p){
      slot.innerHTML = `
        <div class="pav">${p.avatar||'🙂'}</div>
        <div class="pname">${escapeHtml(p.name)}</div>
        <div class="pscore">${p.score||0} نقطة</div>
        <div class="bar ${barClasses[rankIdx]}">${rankIdx+1}</div>`;
    } else {
      slot.innerHTML = `<div class="pav">—</div><div class="pname">—</div><div class="pscore">&nbsp;</div><div class="bar ${barClasses[rankIdx]}">${rankIdx+1}</div>`;
    }
    podiumBox.appendChild(slot);
  });

  rows.forEach((p, i) => {
    const row = document.createElement('div');
    const isMe = p.id === player.id;
    row.className = 'lb-row' + (isMe ? ' me' : '');
    row.innerHTML = `
      <span class="lb-rank">${i+1}</span>
      <span class="lb-av">${p.avatar||'🙂'}</span>
      <span class="lb-name">${escapeHtml(p.name)}</span>
      <span class="lb-score">${p.score||0}</span>`;
    lbList.appendChild(row);
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

/* ================= EXPORT RESULTS (Excel / PDF) ================= */
function getSortedResults(){
  return lastLbData.filter(p => p.name).slice()
    .sort((a,b)=> (b.score||0)-(a.score||0) || (a.totalTimeMs||0)-(b.totalTimeMs||0));
}

function exportExcel(){
  const rows = getSortedResults();
  if(rows.length === 0){ alert('مفيش نتايج لسه عشان تتحمل 🙂'); return; }
  const data = rows.map((p, i) => ({
    'الترتيب': i+1,
    'الكود': p.name,
    'النقاط': p.score || 0,
    'الإجابات الصحيحة': p.correctCount || 0,
    'عدد الأسئلة': p.totalQuestions || 0,
    'أطول سلسلة صح': p.bestStreak || 0,
    'الوقت الإجمالي (ثانية)': p.totalTimeMs ? Math.round(p.totalTimeMs/1000) : 0
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'نتائج الامتحان');
  XLSX.writeFile(wb, 'نتائج_الامتحان.xlsx');
}

function exportPdf(){
  const rows = getSortedResults();
  if(rows.length === 0){ alert('مفيش نتايج لسه عشان تتحمل 🙂'); return; }
  const rowsHtml = rows.map((p, i) => `
    <tr>
      <td>${i+1}</td>
      <td>${escapeHtml(p.name)}</td>
      <td>${p.score || 0}</td>
      <td>${(p.correctCount||0)}/${(p.totalQuestions||0)}</td>
      <td>${p.bestStreak || 0}</td>
    </tr>`).join('');
  const win = window.open('', '_blank');
  if(!win){ alert('المتصفح منع فتح نافذة جديدة، من فضلك اسمحي بالنوافذ المنبثقة وحاولي تاني.'); return; }
  win.document.write(`<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<title>نتائج الامتحان</title>
<style>
  body{ font-family: 'Segoe UI', Tahoma, Arial, sans-serif; padding:24px; color:#1f2430; }
  h1{ text-align:center; margin-bottom:4px; }
  p.sub{ text-align:center; color:#5b6270; margin-top:0; margin-bottom:20px; }
  table{ width:100%; border-collapse:collapse; }
  th, td{ border:1px solid #ccc; padding:8px 10px; text-align:center; font-size:14px; }
  th{ background:#232b3d; color:#fff; }
  tr:nth-child(even){ background:#f5f5f5; }
  @media print{ body{ padding:0; } }
</style>
</head>
<body>
  <h1>نتائج الامتحان</h1>
  <p class="sub">إجمالي عدد الطلاب: ${rows.length}</p>
  <table>
    <thead>
      <tr><th>الترتيب</th><th>الكود</th><th>النقاط</th><th>الإجابات الصحيحة</th><th>أطول سلسلة صح</th></tr>
    </thead>
    <tbody>${rowsHtml}</tbody>
  </table>
</body>
</html>`);
  win.document.close();
  setTimeout(() => { win.focus(); win.print(); }, 300);
}

document.getElementById('exportExcelBtn').addEventListener('click', () => { sfxClick(); exportExcel(); });
document.getElementById('exportPdfBtn').addEventListener('click', () => { sfxClick(); exportPdf(); });

Store.init();
showScreen('login');
</script>
